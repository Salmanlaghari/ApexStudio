name: Android CI Build

on:
  push:
    branches: [ main, master, develop, 'session/**' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"
  PROJECT_DIR: .

jobs:
  build:
    name: Build APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Cache Gradle and Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 cmdline-tools;latest'

      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          cat <<EOF > $ANDROID_HOME/licenses/android-sdk-license
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          8933bad161af4178b1185d1a37fbf41ea5269c55
          EOF
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

