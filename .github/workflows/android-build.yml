name: Android CI Build

on:
  push:
    branches: [ main, master, develop, 'session/**', 'perf/**' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"
  PROJECT_DIR: .
  # Snap Camera Kit staging API token -> BuildConfig.SNAP_CAMERA_KIT_TOKEN.
  # Install the token as the SNAP_CAMERA_KIT_TOKEN repository secret; it is blank for
  # PR builds from forks without the secret (the app then shows a setup message).
  SNAP_CAMERA_KIT_TOKEN: ${{ secrets.SNAP_CAMERA_KIT_TOKEN }}
  # Jamendo API client ID -> BuildConfig.JAMENDO_CLIENT_ID (Discover music tab).
  # Install as the JAMENDO_CLIENT_ID repository secret; blank hides the Discover tab.
  JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}

jobs:
  build:
    name: Build APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Cache Gradle and Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 cmdline-tools;latest ndk;28.2.13676358 cmake;3.22.1'

      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          cat <<EOF > $ANDROID_HOME/licenses/android-sdk-license
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          8933bad161af4178b1185d1a37fbf41ea5269c55
          EOF
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon || true

      - name: Verify offline AI model integrity
        run: |
          python3 scripts/verify-ai-models.py
          python3 scripts/verify-free-ai-policy.py --report
          python3 -m unittest discover -s scripts/tests -p 'test_ai_model_integrity.py'
          python3 -m unittest discover -s scripts/tests -p 'test_fluent_sticker_integrity.py'

      - name: Host GLES workspace shader pixel regression (not Android)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri
          python3 -m pip install numpy PyOpenGL
          python3 scripts/verify-workspace-shaders.py
          python3 scripts/verify-keyframe-shaders.py

      - name: Full JVM regression suite
        run: |
          ./gradlew :buildSrc:test :app:testDebugUnitTest :feature:camerakit:testDebugUnitTest --no-daemon
          python3 -m unittest discover -s scripts/tests -p 'test_apk_provenance.py'
          python3 -m unittest discover -s scripts/tests -p 'test_native_alignment.py'
          python3 -m unittest discover -s scripts/tests -p 'test_range_time_encoder.py'

      - name: Compile Android instrumentation tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon
      - name: Build lean arm64 debug APK and feature bundle
        run: ./gradlew :app:assembleDebug :app:bundleDebug -PapexPhoneBuild=true --stacktrace --no-daemon

      - name: Check debug native ELF and APK ZIP alignment (static only)
        run: |
          python3 scripts/native-alignment.py app/build/outputs/apk/debug/app-debug.apk --output app/build/outputs/apk/debug/native-alignment-apk.json
          python3 scripts/native-alignment.py app/build/outputs/bundle/debug/app-debug.aab --output app/build/outputs/bundle/debug/native-alignment-aab.json
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Verify and identify debug APK
        run: |
          SHA=$(git rev-parse HEAD)
          echo "APK_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          python3 scripts/apk-provenance.py app/build/outputs/apk/debug/app-debug.apk \
            --commit "$SHA" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --output app/build/outputs/apk/debug/build-provenance.json
          python3 scripts/verify-range-time-encoder.py app/build/outputs/apk/debug/app-debug.apk --output app/build/outputs/apk/debug/range-time-encoder.json
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/apexstudio-debug-$SHA.apk"
          echo "### Device-test APK — $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'arm64 phone APK: optional AI weights are downloaded explicitly; Camera Kit needs Play feature delivery. Debug AAB is for bundle inspection, not Play upload.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compare the editor Build badge / Settings > About with build-provenance.json before testing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If installation reports a signature conflict, stop and preserve projects; do not uninstall blindly.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-debug-${{ env.APK_SOURCE_SHA }}-run-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/build-provenance.json
            app/build/outputs/apk/debug/native-alignment-apk.json
            app/build/outputs/apk/debug/range-time-encoder.json
            app/build/outputs/bundle/debug/*.aab
            app/build/outputs/bundle/debug/native-alignment-aab.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload interaction test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-test-results-${{ github.run_id }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            feature/camerakit/build/reports/tests/testDebugUnitTest/
            feature/camerakit/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  # Release build + size report (PR #147, app-size work).
  # Produces a signed release AAB + release arm64 APK and a size breakdown.
  # The signing key here is a THROWAWAY key generated fresh on the runner
  # (alias "upload") for CI size measurement only — it is NOT the Play
  # upload key. Play uploads must be signed with the real upload key.
  release:
    name: Build Release (AAB + APK) + Size Report
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Cache Gradle and Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 cmdline-tools;latest ndk;28.2.13676358 cmake;3.22.1'

      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          cat <<EOF > $ANDROID_HOME/licenses/android-sdk-license
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          8933bad161af4178b1185d1a37fbf41ea5269c55
          EOF
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      # Kilo WARNING (hardcoded keystore password): the throwaway CI
      # keystore gets a fresh random password every run (masked in logs),
      # so no credential is ever hardcoded in the workflow.
      - name: Generate ephemeral keystore password
        run: |
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          echo "CI_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Generate throwaway CI release keystore
        run: |
          keytool -genkey -v -keystore ci-release.keystore -storepass "$CI_KEYSTORE_PASSWORD" \
            -alias upload -keypass "$CI_KEYSTORE_PASSWORD" -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=CI Size Measurement,O=ApexStudio,C=US"

      - name: Build release AAB + APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Check release native alignment (static only, all bundle modules)
        run: |
          python3 scripts/native-alignment.py app/build/outputs/apk/release/app-release.apk --output native-alignment-release-apk.json
          python3 scripts/native-alignment.py app/build/outputs/bundle/release/app-release.aab --output native-alignment-release-aab.json
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk

      - name: Size report (release APK + AAB)
        run: |
          # Kilo WARNING (ls | head -1): deterministic paths — the release
          # build produces exactly these two files. Fail loudly if a
          # renamed/extra output ever appears instead of guessing.
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "missing expected APK: $APK"; exit 1; }
          test -f "$AAB" || { echo "missing expected AAB: $AAB"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          python3 scripts/size-report.py "$APK" "release arm64 APK" | tee size-report-apk.txt
          python3 scripts/size-report.py "$AAB" "release AAB (arm64)" | tee size-report-aab.txt

      - name: Validate bundle configuration and generated splits (static only)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          # Pinned to the SHA-256 digest published on the official release asset.
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar" | sha256sum -c -
          java -jar bundletool.jar dump config --bundle="$AAB" > bundletool-config.json
          grep -q PAGE_ALIGNMENT_16K bundletool-config.json
          java -jar bundletool.jar build-apks --bundle="$AAB" --output=/tmp/app.apks \
            --ks=ci-release.keystore --ks-pass=pass:"$CI_KEYSTORE_PASSWORD" \
            --ks-key-alias=upload --key-pass=pass:"$CI_KEYSTORE_PASSWORD"
          python3 scripts/native-alignment.py /tmp/app.apks --output native-alignment-release-splits.json
          cat > /tmp/device-spec.json <<'JSON'
          {"supportedAbis": ["arm64-v8a"], "supportedLocales": ["en"],
           "screenDensity": 640, "sdkVersion": 35}
          JSON
          java -jar bundletool.jar get-size total --apks=/tmp/app.apks \
            --device-spec=/tmp/device-spec.json | tee bundletool-download-size.txt
          echo 'Static local split checks passed; Play delivery and 16 KB runtime/device testing remain required.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload size reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-reports
          path: |
            size-report-apk.txt
            size-report-aab.txt
            bundletool-download-size.txt
            native-alignment-release-*.json
            bundletool-config.json
          if-no-files-found: ignore
          retention-days: 14
