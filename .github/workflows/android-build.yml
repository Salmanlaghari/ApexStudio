name: Android CI Build

on:
  push:
    branches: [ main, master, develop, 'session/**', 'perf/**' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"
  PROJECT_DIR: .
  # Snap Camera Kit staging API token -> BuildConfig.SNAP_CAMERA_KIT_TOKEN.
  # Install the token as the SNAP_CAMERA_KIT_TOKEN repository secret; it is blank for
  # PR builds from forks without the secret (the app then shows a setup message).
  SNAP_CAMERA_KIT_TOKEN: ${{ secrets.SNAP_CAMERA_KIT_TOKEN }}
  # Jamendo API client ID -> BuildConfig.JAMENDO_CLIENT_ID (Discover music tab).
  # Install as the JAMENDO_CLIENT_ID repository secret; blank hides the Discover tab.
  JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}

jobs:
  build:
    name: Build APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Cache Gradle and Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 cmdline-tools;latest'

      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          cat <<EOF > $ANDROID_HOME/licenses/android-sdk-license
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          8933bad161af4178b1185d1a37fbf41ea5269c55
          EOF
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  # Release build + size report (PR #147, app-size work).
  # Produces a signed release AAB + release arm64 APK and a size breakdown.
  # The signing key here is a THROWAWAY key generated fresh on the runner
  # (alias "upload") for CI size measurement only — it is NOT the Play
  # upload key. Play uploads must be signed with the real upload key.
  release:
    name: Build Release (AAB + APK) + Size Report
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Cache Gradle and Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 cmdline-tools;latest'

      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          cat <<EOF > $ANDROID_HOME/licenses/android-sdk-license
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          8933bad161af4178b1185d1a37fbf41ea5269c55
          EOF
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Generate throwaway CI release keystore
        run: |
          keytool -genkey -v -keystore ci-release.keystore -storepass ci-release \
            -alias upload -keypass ci-release -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=CI Size Measurement,O=ApexStudio,C=US"

      - name: Build release AAB + APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: ci-release
          KEY_PASSWORD: ci-release
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Size report (release APK + AAB)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          python3 scripts/size-report.py "$APK" "release arm64 APK" | tee size-report-apk.txt
          python3 scripts/size-report.py "$AAB" "release AAB (arm64)" | tee size-report-aab.txt

      - name: Estimated arm64 download size (bundletool, best-effort)
        run: |
          set +e
          curl -sL -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          if [ ! -s bundletool.jar ]; then echo "bundletool download failed, skipping"; exit 0; fi
          cat > /tmp/device-spec.json <<'JSON'
          {"supportedAbis": ["arm64-v8a"], "supportedLocales": ["en"],
           "screenDensity": 640, "sdkVersion": 34}
          JSON
          java -jar bundletool.jar build-apks --bundle="$AAB" --output=/tmp/app.apks \
            --ks=ci-release.keystore --ks-pass=pass:ci-release \
            --ks-key-alias=upload --key-pass=pass:ci-release > /dev/null 2>&1
          java -jar bundletool.jar get-size total --apks=/tmp/app.apks \
            --device-spec=/tmp/device-spec.json | tee bundletool-download-size.txt
          echo "bundletool exit: $?"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apexstudio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload size reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-reports
          path: |
            size-report-apk.txt
            size-report-aab.txt
            bundletool-download-size.txt
          if-no-files-found: ignore
          retention-days: 14


